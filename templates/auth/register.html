{% extends "base.html" %}
{% block title %}Inscription — Dailymobile{% endblock %}
{% block content %}
<div class="form-card">
    <h1 style="font-size: 1.75rem; margin-bottom: 24px;">Créer un compte</h1>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>Nom</label>
            <input type="text" name="nom" required>
        </div>
        <div class="form-group">
            <label>Prénom</label>
            <input type="text" name="prenom" required>
        </div>
        <div class="form-group">
            <label>Email (optionnel)</label>
            <input type="email" name="email">
        </div>
        <div class="form-group">
            <label>Téléphone (optionnel)</label>
            <input type="text" name="telephone">
        </div>
        <div class="form-group">
            <label>Mot de passe</label>
            <input type="password" name="password" required minlength="8">
        </div>
        <div class="form-group">
            <label>Confirmer le mot de passe</label>
            <input type="password" name="password_confirm" required minlength="8">
        </div>
        <button type="submit" class="btn" style="width: 100%;">Créer mon compte</button>
    </form>
    <p class="text-center mt-3" style="font-size: 0.9rem;">
        Déjà un compte ? <a href="{% url 'web-login' %}" style="color: var(--accent);">Se connecter</a>
    </p>
</div>
{% endblock %}
