{% extends "base.html" %}
{% block title %}Inscription — Dailymobile{% endblock %}

{% block content %}
<div style="padding: 48px 0 40px;">
    <div class="form-card">
        <h1 style="font-size: 28px; font-weight: 600; letter-spacing: -0.03em; margin-bottom: 8px; text-align: center;">
            Créer un compte
        </h1>
        <p style="color: var(--text-secondary); font-size: 15px; text-align: center; margin-bottom: 32px;">
            Email ou téléphone — au choix
        </p>

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>Nom</label>
                <input type="text" name="nom" required>
            </div>
            <div class="form-group">
                <label>Prénom</label>
                <input type="text" name="prenom" required>
            </div>
            <div class="form-group">
                <label>Email (optionnel)</label>
                <input type="email" name="email">
            </div>
            <div class="form-group">
                <label>Téléphone (optionnel)</label>
                <input type="text" name="telephone" placeholder="677000000">
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" name="password" required minlength="8">
            </div>
            <div class="form-group">
                <label>Confirmer le mot de passe</label>
                <input type="password" name="password_confirm" required minlength="8">
            </div>
            <button type="submit" class="btn" style="width: 100%; margin-top: 8px;">Créer mon compte</button>
        </form>

        <p class="text-center mt-3" style="font-size: 14px; color: var(--text-secondary);">
            Déjà un compte ?
            <a href="{% url 'web-login' %}" style="color: var(--accent); text-decoration: none;">Se connecter</a>
        </p>
    </div>
</div>
{% endblock %}
