{% extends "base.html" %}
{% block title %}Commander — Dailymobile{% endblock %}

{% block content %}
<section class="hero" style="padding: 48px 0 24px;">
    <h1 style="font-size: 40px;">Commander</h1>
    <p class="subtitle">Total articles · {{ total }} FCFA</p>
</section>

<div class="form-card" style="max-width: 480px;">
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>Mode de réception</label>
            <select name="mode_reception" id="mode" onchange="toggleLivraison()">
                <option value="RETRAIT_BOUTIQUE">Retrait en boutique</option>
                <option value="LIVRAISON">Livraison à domicile</option>
            </select>
        </div>

        <div id="livraison-fields" style="display: none;">
            <div class="form-group">
                <label>Nom du destinataire</label>
                <input type="text" name="nom_destinataire">
            </div>
            <div class="form-group">
                <label>Téléphone</label>
                <input type="text" name="telephone">
            </div>
            <div class="form-group">
                <label>Ville</label>
                <input type="text" name="ville_nom" placeholder="Douala, Yaoundé…">
            </div>
            <div class="form-group">
                <label>Quartier</label>
                <input type="text" name="quartier">
            </div>
            <div class="form-group">
                <label>Adresse détaillée</label>
                <textarea name="adresse_detail" rows="2"></textarea>
            </div>
            <div class="form-group">
                <label>Point de repère (optionnel)</label>
                <input type="text" name="point_repere">
            </div>
        </div>

        <button type="submit" class="btn" style="width: 100%; margin-top: 12px;">
            Confirmer la commande
        </button>
    </form>
</div>

<script>
function toggleLivraison() {
    var mode = document.getElementById('mode').value;
    document.getElementById('livraison-fields').style.display =
        mode === 'LIVRAISON' ? 'block' : 'none';
}
</script>
{% endblock %}
